name: LeafScan V3 CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-validate:
    name: Code Quality & Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Lint with Ruff
        run: |
          uv pip install --system ruff
          ruff check src/ tests/
          ruff format --check src/ tests/

  test-serving:
    name: Production Serving & Parity Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Serving Dependencies Only (Zero TensorFlow)
        run: |
          uv pip install --system -e ".[serve,dev]"

      - name: Run Serving & Golden Regression Tests
        run: |
          python -m pytest tests/test_v3_serving.py tests/test_api.py -v

      - name: Dependency Security Audit
        run: |
          uv pip install --system pip-audit
          pip-audit --desc on

  docker-build-and-scan:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test-serving]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: leafscan:latest
          load: true

      - name: Verify Image Size (< 500 MB)
        run: |
          IMAGE_SIZE_BYTES=$(docker image inspect leafscan:latest --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))
          echo "Built Image Size: ${IMAGE_SIZE_MB} MB"
          if [ "$IMAGE_SIZE_MB" -gt 500 ]; then
            echo "ERROR: Docker image exceeds 500 MB budget (${IMAGE_SIZE_MB} MB)"
            exit 1
          fi
          echo "✅ Image size satisfies V3 production budget (<500MB)."

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: leafscan:latest
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          image: leafscan:latest
          format: spdx-json
          output-file: sbom.spdx.json
