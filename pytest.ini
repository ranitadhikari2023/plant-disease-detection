[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    regression: Core regression tests for V2 hierarchical inference
    pipeline: Unit tests for data loading and preprocessing pipeline
    losses: Unit tests for focal loss and class weighting
    smoke: Integration smoke tests for API and inference
    api: Unit and integration tests for FastAPI service
    security: Security and defensive image intake tests
filterwarnings =
    ignore::DeprecationWarning
