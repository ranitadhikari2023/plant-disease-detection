[project]
name = "leafscan"
version = "3.0.0"
description = "Production Deep Learning Plant Pathology Screening System"
authors = [{ name = "LeafScan Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.8.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
]
train = [
    "tensorflow==2.21.0",
    "keras==3.12.1",
    "tf2onnx==1.17.0",
    "onnx==1.23.2",
    "matplotlib>=3.9.0",
    "psutil>=6.0.0",
    "protobuf>=4.25.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leafscan"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "regression: Core regression tests for V2 hierarchical inference",
    "pipeline: Unit tests for data loading and preprocessing pipeline",
    "losses: Unit tests for focal loss and class weighting",
    "smoke: Integration smoke tests for API and inference",
    "api: Unit and integration tests for FastAPI service",
    "parity: Numerical parity tests between Keras and ONNX",
    "security: Security and adversarial intake tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
