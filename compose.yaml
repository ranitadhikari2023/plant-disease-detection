name: leafscan

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: leafscan:3.0.0
    container_name: leafscan-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LEAFSCAN_APP_ENV=production
      - LEAFSCAN_HOST=0.0.0.0
      - LEAFSCAN_PORT=8000
      - LEAFSCAN_LOG_JSON=true
      - LEAFSCAN_LOG_LEVEL=INFO
      - LEAFSCAN_MAX_CONCURRENT_INFERENCES=4
      - LEAFSCAN_RATE_LIMIT_PER_MINUTE=60
      - LEAFSCAN_INTRA_OP_THREADS=2
      - LEAFSCAN_INTER_OP_THREADS=1
      - LEAFSCAN_MODEL_BUNDLE_PATH=/app/models/bundles/v3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)\" || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
